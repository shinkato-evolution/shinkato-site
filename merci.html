<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>C'est noté — Shinkatô</title>
  <meta name="description" content="Ton adresse est enregistrée. Tu seras prévenu à l'ouverture du Chapitre I de Shinkatô.">
  <!-- Page de confirmation : on ne veut pas d'elle dans les résultats de recherche. -->
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,900;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Page courte et centrée : elle n'a qu'un message à porter. */
    .merci-wrap {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 5vw;
    }
    .merci-emblem { width: 92px; margin-bottom: 28px; opacity: 0.9; }
    .merci-body { margin: 22px auto 0; max-width: 52ch; color: var(--blanc-60); line-height: 1.6; }
    .merci-actions { margin-top: 38px; display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
  </style>
</head>
<body>
  <main class="merci-wrap">
    <img src="assets/logo_blanc.png" alt="Shinkatô" class="merci-emblem">
    <h1 class="cta-title">C'est noté</h1>
    <p class="merci-body">
      Ton adresse est enregistrée. Tu seras prévenu dès l'ouverture du Chapitre I —
      un seul message, le jour de la sortie. Rien d'autre.
    </p>
    <p class="merci-body">
      D'ici là, le territoire t'attend déjà sur la page d'accueil : il est jouable.
    </p>
    <div class="merci-actions">
      <a class="btn btn-yellow" href="index.html#territoire">Retourner sur le territoire</a>
      <a class="btn btn-ghost" href="index.html">Revenir à l'accueil</a>
    </div>
  </main>
</body>
</html>
